[package]
name = "pandamux-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "pandamux-cli"
path = "src/main.rs"

[dependencies]
pandamux-core = { path = "../pandamux-core" }
pandamux-protocol = { path = "../pandamux-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "net", "process", "time"] }
uuid.workspace = true

[dev-dependencies]
pandamux-server = { path = "../pandamux-server" }
