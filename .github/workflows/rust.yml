name: Rust Native

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "crates/**"
      - "tools/**"
      - "scripts/**"
      - ".github/workflows/rust.yml"
  push:
    branches: ["master", "main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "crates/**"
      - "tools/**"
      - "scripts/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUST_BACKTRACE: 1

jobs:
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # cargo-deny-action is a Docker action and GitHub only supports
      # container actions on Linux runners.
      - name: Check advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: advisories licenses bans sources

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Catches a refactor that moves the tree out from under a rule paths glob.
      - name: Claude wiring guard (rule scoping + hook matchers)
        run: node scripts/check-claude-wiring.mjs

      - name: Install pinned development Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test resolved-graph boundary fixtures
        run: cargo test --locked -p pandamux-boundary-check

      - name: Check resolved crate boundaries
        run: cargo run --locked -p pandamux-boundary-check --quiet

      - name: Test workspace
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --release -p pandamux-cli -p pandamux-server -p pandamux-desktop

      - name: Evaluate built artifacts (BP evaluate-built-artifacts-in-ci)
        shell: pwsh
        run: .\scripts\smoke-built-artifacts.ps1 -TargetDir target/release

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pinned development Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Test server, CLI, client, and desktop
        run: cargo test -p pandamux-core -p pandamux-protocol -p pandamux-client -p pandamux-server -p pandamux-cli -p pandamux-desktop

      - name: Test pure orchestrator
        run: cargo test --locked -p pandamux-orchestrator

      - name: Build workspace binaries
        run: cargo build --release -p pandamux-cli -p pandamux-server -p pandamux-desktop

  linux-musl:
    name: Linux musl (x64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pinned development Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Build musl server and CLI
        run: cargo build --release --target x86_64-unknown-linux-musl -p pandamux-server -p pandamux-cli

  orchestrator-musl:
    name: Pure orchestrator (musl ${{ matrix.arch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v7

      - name: Install pinned development Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          key: orchestrator-${{ matrix.target }}

      - name: Check orchestrator library and test targets
        run: cargo check --locked --target ${{ matrix.target }} -p pandamux-orchestrator --all-targets

  msrv-windows:
    name: Rust 1.89 MSRV (Windows product graph)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Check all Windows targets at MSRV
        run: cargo +1.89.0 check --locked --workspace --all-targets

  msrv-headless-linux:
    name: Rust 1.89 MSRV (Linux headless graph)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Check server and CLI graph at MSRV
        run: cargo +1.89.0 check --locked --workspace --all-targets --exclude pandamux-desktop
