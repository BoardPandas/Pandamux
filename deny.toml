# Configuration for cargo-deny (Phase 1 Step 11)

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
# Vulnerability advisories are errors under current cargo-deny defaults.
unmaintained = "workspace"
yanked = "warn"
ignore = []

[licenses]
# Unlicensed and unlisted licenses are denied by default.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.8
# Existing transitive crates whose declared licenses are outside the global
# allowlist. Keep these scoped so new crates with those licenses still fail.
exceptions = [
    { crate = "cbindgen@0.28.0", allow = ["MPL-2.0"] },
    { crate = "dwrote@0.11.5", allow = ["MPL-2.0"] },
    { crate = "enum-iterator@2.3.0", allow = ["0BSD"] },
    { crate = "enum-iterator-derive@1.5.0", allow = ["0BSD"] },
    { crate = "libbz2-rs-sys@0.2.5", allow = ["bzip2-1.0.6"] },
    { crate = "option-ext@0.2.0", allow = ["MPL-2.0"] },
    { crate = "webpki-roots@1.0.9", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = []
