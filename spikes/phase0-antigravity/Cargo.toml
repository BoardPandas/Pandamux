[package]
name = "phase0-antigravity"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
